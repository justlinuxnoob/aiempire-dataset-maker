name: Build LoRA trainer image

on:
  push:
    branches: [main]
    paths: ["trainer/**", "!trainer/**.md", ".github/workflows/trainer.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the AI Toolkit base image is big)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # same package as the dataset maker (already public), different tag
      - uses: docker/build-push-action@v6
        with:
          context: trainer
          file: trainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiempire-dataset-maker:lora-trainer
            ghcr.io/${{ github.repository_owner }}/aiempire-dataset-maker:lora-trainer-${{ github.sha }}
